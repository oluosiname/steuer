# Refreshes the bundled Finanzamt table from the BZSt GemFA export.
#
# Run manually (Actions -> Update Finanzamt table -> Run workflow) when the
# bundled table should be brought up to date, typically before cutting a
# release. BZSt republishes GemFA on the 1st and 15th of each month.
#
# Opens a PR only when the data actually differs. The PR body summarises which
# offices were added, removed or renamed, so the 1700-line YAML diff does not
# have to be read directly.

name: Update Finanzamt table

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          bundler-cache: true

      - name: Regenerate table from BZSt GemFA export
        run: bundle exec rake update_finanzaemter

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- lib/steuer/data/finanzaemter.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "GemFA data is unchanged; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo 'summary<<PR_BODY_EOF'
              ruby tasks/finanzaemter_diff.rb
              echo 'PR_BODY_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests against the refreshed data
        if: steps.changes.outputs.changed == 'true'
        run: bundle exec rspec

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/update-finanzaemter
          base: main
          title: "chore: refresh Finanzamt table from BZSt GemFA"
          commit-message: "chore: refresh Finanzamt table from BZSt GemFA"
          add-paths: lib/steuer/data/finanzaemter.yml
          delete-branch: true
          body: |
            Automated refresh of `lib/steuer/data/finanzaemter.yml` from the
            [BZSt GemFA export](https://www.bzst.de/DE/Service/Behoerdenwegweiser/Finanzamtsuche/finanzamtsuche_node.html).

            ${{ steps.changes.outputs.summary }}

            ---

            Generated by `rake update_finanzaemter`. The test suite passed against
            the refreshed data before this PR was opened.
